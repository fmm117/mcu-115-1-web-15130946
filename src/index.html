<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>電子商城</title>
    <link rel="stylesheet" href="style.min.css" />
  </head>
  <body>
    <section>
      <header>
        <div class="header-actions">
           <label for="book-search">書名或作者</label>
           <div class="search">
             <input id="book-search" type="search" placeholder="查詢書名、作者..." />
             <button type="button" aria-label="搜尋">
               <span class="material-symbols-outlined" aria-hidden="true">search</span>
             </button>
           </div>
           <button type="button" aria-label="我的最愛">
             <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
           </button>
           <button type="button" aria-label="購物車">
             <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
           </button>
         </div>
        <div class="container">
          <div class="header-inner">
            <div class="header-brand">
              <h3 class="site-title">電子商城</h3>
              <nav>
                <a href="#">首頁</a>
                <a href="#">最新上架</a>
                <a href="#">暢銷排行</a>
                <a href="#">主題專區</a>
                <a href="#">會員中心</a>
              </nav>
            </div>
            <div class="header-actions">
              <button type="button">我的最愛</button>
              <button type="button">購物車</button>
            </div>
          
            <div class="header-actions">
              < class="search">
                <input type="text" placeholder="查詢書名、作者..." />
                <button type="button">查詢</button>
              
              <button type="button" aria-label="搜尋">
                  <span class="material-symbols-outlined" aria-hidden="true">search</span>
                </button>
              
              <button type="button" aria-label="我的最愛">
                <span class="material-symbols-outlined" aria-hidden="true">favorite</span>
              </button>
              <button type="button" aria-label="購物車">
                <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
              </button>
            </div>
            </div>
          </div>
        </div>
      </header>
      <div class="main">Main</div>
      <footer>
        <div class="container">
          <div class="footer-inner">
            <nav class="footer-nav" aria-label="頁尾導覽">
              <a href="#">首頁</a>
              <a href="#">最新上架</a>
              <a href="#">暢銷排行</a>
              <a href="#">主題專區</a>
              <a href="#">會員中心</a>
            </nav>
            <p>Copyright 2025 電子商城版權所有</p>
          </div>
        </div>
      </footer>
    </section>

</html>
